<!-- Toast Notification -->
    <div id="toast" class="toast" role="status" aria-live="polite">
        <svg class="icon" aria-hidden="true"><use href="#i-check-circle"></use></svg>
        <span data-en="Registration Submitted successfully!" data-ml="രജിസ്ട്രേഷൻ വിജയകരമായി സമർപ്പിച്ചു!">Registration Submitted successfully!</span>
    </div>

    <!-- Image Modal (Lightbox) -->
    <div id="imageModal" class="modal" role="dialog" aria-modal="true" aria-label="Image viewer">
        <button type="button" class="modal-close" aria-label="Close">&times;</button>
        <button type="button" class="modal-prev" aria-label="Previous image">&#10094;</button>
        <button type="button" class="modal-next" aria-label="Next image">&#10095;</button>
        <img class="modal-content" id="modalImage" alt="">
    </div>

    <footer class="footer" id="register">
        <div class="footer-content floating-card">
            <div class="contact-info">
                <h3 data-en="Join the Community" data-ml="ഞങ്ങളോടൊപ്പം ചേരൂ">Join the Community</h3>
                <p>📍 <span data-en="Near Viyani Cemetery, Punnapra" data-ml="വിയാനി സെമിത്തേരിക്ക് സമീപം, പുന്നപ്ര">Near Viyani Cemetery, Punnapra</span></p>
                <div class="privacy-link-wrap">
                    <a href="privacy.html" class="privacy-link" data-en="Privacy Policy &amp; Child Safety" data-ml="സ്വകാര്യതാ നയവും ശിശു സുരക്ഷയും">Privacy Policy &amp; Child Safety</a>
                </div>
            </div>
            <div class="registration">
                <h4 data-en="Parent Registration" data-ml="രക്ഷിതാക്കളുടെ രജിസ്ട്രേഷൻ">Parent Registration</h4>
                <form id="regForm" action="/api/register" method="POST" novalidate>
                    <label class="visually-hidden" for="reg-parent" data-en="Parent's Name" data-ml="രക്ഷിതാവിന്റെ പേര്">Parent's Name</label>
                    <input id="reg-parent" type="text" name="parent" placeholder="Parent's Name" data-placeholder-ml="രക്ഷിതാവിന്റെ പേര്" autocomplete="name" minlength="2" maxlength="60" required>

                    <label class="visually-hidden" for="reg-child" data-en="Child's Name" data-ml="കുട്ടിയുടെ പേര്">Child's Name</label>
                    <input id="reg-child" type="text" name="child" placeholder="Child's Name" data-placeholder-ml="കുട്ടിയുടെ പേര്" autocomplete="off" minlength="2" maxlength="60" required>

                    <label class="visually-hidden" for="reg-phone" data-en="Phone Number" data-ml="ഫോൺ നമ്പർ">Phone Number</label>
                    <input id="reg-phone" type="tel" name="phone" placeholder="Phone Number" data-placeholder-ml="ഫോൺ നമ്പർ" inputmode="numeric" autocomplete="tel" maxlength="15" pattern="^(\+?91[\s\-]?)?[6-9][0-9]{9}$" title="10-digit mobile number, e.g. 98470 12345" data-title-ml="10 അക്ക മൊബൈൽ നമ്പർ നൽകുക (ഉദാ: 98470 12345)" required>

                    <!-- Honeypot field (hidden from humans, catches bots) -->
                    <div class="hp" aria-hidden="true">
                        <label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
                    </div>

                    <!-- Consent checkbox for child privacy & communication -->
                    <label class="consent-label">
                        <input type="checkbox" name="consent" value="yes" class="consent-checkbox" required>
                        <span data-en="I am the child's parent/guardian and agree that Six S Punnapra may use these details to contact me regarding sports training." data-ml="ഞാൻ കുട്ടിയുടെ രക്ഷിതാവാണ്. കായിക പരിശീലനവുമായി ബന്ധപ്പെട്ട് എന്നെ ബന്ധപ്പെടാൻ ഈ വിവരങ്ങൾ ഉപയോഗിക്കുന്നതിന് ഞാൻ സമ്മതിക്കുന്നു.">I am the child's parent/guardian and agree that Six S Punnapra may use these details to contact me regarding sports training.</span>
                    </label>

                    <button type="submit" class="submit-btn" data-en="Enroll Now" data-ml="രജിസ്റ്റർ ചെയ്യുക">Enroll Now</button>
                    <p id="formStatus" role="status" aria-live="polite"></p>
                </form>
            </div>
        </div>
        <p class="copyright">© 2026 Six S Punnapra. All rights reserved.</p>
    </footer>
